[package]
name = "relatum"
version = "0.1.0"
edition = "2021"
description = "A relation-centered foundation for mathematical structures"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
